name: Bug report
description: Something priority-axi does wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste passwords, server addresses or real customer data; replace them with placeholders.
        For a security problem, use the private report in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit, or the `version` line from `priority-axi` (the home view).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system, and Priority version if known.
      placeholder: Node 22.18, macOS 15, Priority 23.1
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command you ran and what it printed.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
